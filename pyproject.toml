[project]
name = "syncplay"
dynamic = ["version"]
description = "Client/server to synchronize media playback on mpv/VLC/MPC-HC/MPC-BE on many computers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Syncplay", email = "dev@syncplay.pl" }]
maintainers = [{ name = "Syncplay", email = "dev@syncplay.pl" }]
keywords = ["sync", "playback", "mpv", "vlc", "mpc-hc", "watch-party"]
dependencies = [
    "certifi>=2018.11.29",
    "pem>=21.2.0",
    "twisted[tls]>=16.4.0",
    "appnope>=0.1.0; sys_platform == 'darwin'",
    "pywin32>=223; sys_platform == 'win32'",
    "zope.interface>=4.4.0; sys_platform == 'win32'",
]
classifiers=[
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X :: Cocoa",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Framework :: Twisted",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Natural Language :: English",
    "Natural Language :: German",
    "Natural Language :: Italian",
    "Natural Language :: Russian",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Multimedia :: Video"
]

[project.urls]
Homepage = "https://syncplay.pl/"
Download = "https://syncplay.pl/download/"
Repository = "https://github.com/Syncplay/syncplay"
Issues = "https://github.com/Syncplay/syncplay/issues"

[project.optional-dependencies]
gui = [
    "pyside2>=5.11.0; sys_platform != 'darwin' and (python_version < '3.11')",
    "pyside6; sys_platform == 'darwin' or (python_version >= '3.11')",
    "requests>=2.20.0; sys_platform == 'darwin'"
]

[project.scripts]
syncplay-server = "syncplay.ep_server:main"

[project.gui-scripts]
syncplay = "syncplay.ep_client:main"

[tool.setuptools.dynamic]
version = { attr = "syncplay.version" }

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "dmgbuild; sys_platform == 'darwin'",
    "pyinstaller",
]
