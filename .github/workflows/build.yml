name: Build
on: [push, pull_request]

jobs:
  windows:
    name: Build for Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            architecture: x86
          - python-version: "3.8"
            architecture: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Build
        run: uv run pyinstaller --noconfirm build.spec

      - name: Test packaged GUI startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\syncplay\Syncplay.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Packaged Syncplay.exe exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Create installer
        run: uv run ./ci/win-create-nsis.py

      - name: Prepare for deployment
        run: |
          $version = (Get-Content syncplay/__init__.py | Select-String -Pattern "version\s*=\s*'(.+?)'" | ForEach-Object { $_.Matches.Groups[1].Value })
          echo "VER=$version" >> $env:GITHUB_ENV

      - name: Deploy portable
        uses: actions/upload-artifact@v6
        with:
          name: Syncplay_${{ env.VER }}_${{ matrix.architecture }}_Portable
          path: |
            dist/syncplay

      - name: Deploy installer
        uses: actions/upload-artifact@v6
        with:
          name: Syncplay-${{ env.VER }}-${{ matrix.architecture }}-Setup.exe
          path: |
            Syncplay-${{ env.VER }}-Setup.exe

  macos:
    name: Build for macOS
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup universal2 Python
        run: |
          curl -LO https://www.python.org/ftp/python/3.10.6/python-3.10.6-macos11.pkg
          sudo installer -verbose -pkg ./python-3.10.6-macos11.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.10/bin" >> $GITHUB_PATH

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --all-extras --dev --python /Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10

      - name: Build universal2 dependencies
        env:
          CFLAGS: -arch x86_64 -arch arm64
          ARCHFLAGS: -arch x86_64 -arch arm64
        run: |
          uv pip install --python .venv/bin/python --reinstall --no-binary :all: "cffi==1.17.1" "zope.interface==7.2"

      - name: Install universal2 wheels
        run: |
          /Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10 -m pip download --platform macosx_10_10_universal2 --only-binary :all: --no-deps --dest . "cryptography==44.0.2"
          /Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10 -m pip download --platform macosx_10_9_universal2 --only-binary :all: --no-deps --dest . "charset-normalizer==3.4.1"
          uv pip install --python .venv/bin/python --reinstall --no-deps --no-index --find-links . "cryptography==44.0.2" "charset-normalizer==3.4.1"

      - name: Build
        run: uv run pyinstaller --noconfirm build.spec

      - name: Prepare for deployment
        run: |
          ls -al
          export VER="$(cat syncplay/__init__.py | awk '/version/ {gsub("\047", "", $3); print $NF}')"
          echo "VER=$VER" >> $GITHUB_ENV
          mkdir dist_actions
          ci/macos-deploy.sh
          ls -al dist_actions

      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: Syncplay_${{ env.VER }}.dmg
          path: |
            dist_actions/Syncplay_${{ env.VER }}.dmg

  deb:
    name: Build Debian package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: ci/deb-script.sh

      - name: Build server
        run: ci/deb-server-script.sh

      - name: Test
        run: ci/deb-installation-test.sh

      - name: Prepare for deployment
        run: |
          ls -al
          export VER="$(cat syncplay/__init__.py | awk '/version/ {gsub("\047", "", $3); print $NF}')"
          echo "VER=$VER" >> $GITHUB_ENV
          mkdir dist_actions
          mv /tmp/syncplay.deb dist_actions/syncplay_${VER}.deb
          mv /tmp/syncplay-server.deb dist_actions/syncplay-server_${VER}.deb
          ls -al dist_actions

      - name: Deploy full deb
        uses: actions/upload-artifact@v6
        with:
          name: syncplay.deb
          path: |
            dist_actions/syncplay_*.deb

      - name: Deploy server deb
        uses: actions/upload-artifact@v6
        with:
          name: syncplay-server.deb
          path: |
            dist_actions/syncplay-server_*.deb
