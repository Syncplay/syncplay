name: Build

on:
  push:
    branches: [master]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check the lockfile
        run: uv lock --check

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run python -m unittest discover -s tests -v

      - name: Build
        run: uv build

      - name: Test the built wheel
        run: |
          uv venv wheel-test --python 3.12
          uv pip install --python wheel-test/bin/python dist/*.whl
          cd wheel-test && bin/python -m unittest discover -s ../tests -v

  windows:
    name: Build for Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.8"
            architecture: x86
          - python-version: "3.8"
            architecture: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Build
        run: uv run pyinstaller --noconfirm build.spec

      - name: Test packaged GUI startup
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\syncplay\Syncplay.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Packaged Syncplay.exe exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Create installer
        run: uv run ./ci/win-create-nsis.py

      - name: Prepare for deployment
        run: |
          $version = uv run python -c "import syncplay; print(syncplay.version)"
          echo "VER=$version" >> $env:GITHUB_ENV

      - name: Deploy portable
        uses: actions/upload-artifact@v6
        with:
          name: Syncplay_${{ env.VER }}_${{ matrix.architecture }}_Portable
          path: |
          retention-days: ${{ github.event_name == \'pull_request\' && 7 || 14 }}
            dist/syncplay

      - name: Deploy installer
        uses: actions/upload-artifact@v6
        with:
          name: Syncplay-${{ env.VER }}-${{ matrix.architecture }}-Setup.exe
          path: |
          retention-days: ${{ github.event_name == \'pull_request\' && 7 || 14 }}
            Syncplay-${{ env.VER }}-Setup.exe

  macos:
    name: Build for macOS
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup universal2 Python
        run: |
          curl -LO https://www.python.org/ftp/python/3.10.6/python-3.10.6-macos11.pkg
          sudo installer -verbose -pkg ./python-3.10.6-macos11.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.10/bin" >> $GITHUB_PATH

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        run: uv sync --all-extras --dev --python /Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10

      - name: Build universal2 dependencies
        env:
          CFLAGS: -arch x86_64 -arch arm64
          ARCHFLAGS: -arch x86_64 -arch arm64
        run: |
          # Compile the locked versions from source so the binary matches uv.lock.
          freeze() { uv pip freeze --python .venv/bin/python | sed -n "s/^$1==//p"; }
          uv pip install --python .venv/bin/python --reinstall --no-binary :all: \
            "cffi==$(freeze cffi)" "zope.interface==$(freeze 'zope\.interface')"

      - name: Install universal2 wheels
        env:
          # cryptography dropped universal2 wheels in 50, so the macOS build
          # cannot follow uv.lock here. These are the newest versions that still
          # publish macosx_*_universal2 wheels for this interpreter; bump them
          # only after checking that a universal2 wheel exists for the version.
          CRYPTOGRAPHY: cryptography==44.0.2
          CHARSET_NORMALIZER: charset-normalizer==3.4.1
        run: |
          PY=/Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10
          for spec in "$CRYPTOGRAPHY" "$CHARSET_NORMALIZER"; do
            "$PY" -m pip download --platform macosx_10_10_universal2 --only-binary :all: --no-deps --dest . "$spec"
          done
          uv pip install --python .venv/bin/python --reinstall --no-deps --no-index --find-links . \
            "$CRYPTOGRAPHY" "$CHARSET_NORMALIZER"

      - name: Build
        run: uv run pyinstaller --noconfirm build.spec

      - name: Prepare for deployment
        run: |
          ls -al
          export VER="$(python3 -c 'import syncplay; print(syncplay.version)')"
          echo "VER=$VER" >> $GITHUB_ENV
          mkdir dist_actions
          ci/macos-deploy.sh
          ls -al dist_actions

      - name: Deploy
        uses: actions/upload-artifact@v6
        with:
          name: Syncplay_${{ env.VER }}.dmg
          path: |
          retention-days: ${{ github.event_name == \'pull_request\' && 7 || 14 }}
            dist_actions/Syncplay_${{ env.VER }}.dmg

  deb:
    name: Build Debian package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: ci/deb-script.sh

      - name: Build server
        run: ci/deb-server-script.sh

      - name: Test
        run: ci/deb-installation-test.sh

      - name: Prepare for deployment
        run: |
          ls -al
          export VER="$(python3 -c 'import syncplay; print(syncplay.version)')"
          echo "VER=$VER" >> $GITHUB_ENV
          mkdir dist_actions
          mv /tmp/syncplay.deb dist_actions/syncplay_${VER}.deb
          mv /tmp/syncplay-server.deb dist_actions/syncplay-server_${VER}.deb
          ls -al dist_actions

      - name: Deploy full deb
        uses: actions/upload-artifact@v6
        with:
          name: syncplay.deb
          path: |
          retention-days: ${{ github.event_name == \'pull_request\' && 7 || 14 }}
            dist_actions/syncplay_*.deb

      - name: Deploy server deb
        uses: actions/upload-artifact@v6
        with:
          name: syncplay-server.deb
          path: |
          retention-days: ${{ github.event_name == \'pull_request\' && 7 || 14 }}
            dist_actions/syncplay-server_*.deb
